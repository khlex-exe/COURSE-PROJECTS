<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Garage — Car Details</title>
<link rel="icon" type="image/svg+xml" href="/graduation-project/favicon.svg">


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.min.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="project.css">
<link rel="stylesheet" href="car-detail.css">

</head>
<body>

<nav>
  <div class="logo"><i class="bi bi-car-front-fill"></i> The Garage</div>
  <ul class="nav-links">
    <li><a href="project.html">Garage</a></li>
    <li><a href="project.html#about">About</a></li>
    <li><a href="project.html#contact">Contact</a></li>
  </ul>
  <button class="nav-toggle"><i class="bi bi-list"></i></button>
</nav>

<!-- SECTION 1: Hero — main photo + title, filled in by render-car.js -->
<section class="hero">
  <img id="car-image" class="hero-img" src="" alt="">
  <div class="hero-content">
    <h1 id="car-brand"></h1>
    <h2 id="car-name"></h2>
    <p id="car-meta"></p>
  </div>
</section>



<!-- SECTION 3: Video -->
<section class="video-section" id="video-section">
  <video id="reveal-video" class="reveal-video" loop muted autoplay playsinline></video>
</section>

<!-- SECTION 4: 3D model -->
<section class="model-section" id="model-section">
  <h2 class="model-label">EXPLORE IN 3D</h2>
  <model-viewer
    id="reveal-model"
    class="reveal-model"
    camera-controls
    auto-rotate
    ar>
  </model-viewer>
</section>

<!-- SECTION 5: Specs + description -->
<section class="specs-section">
  <div class="specs-box">
    <h3 id="specs-name"></h3>
    <ul id="specs-list"></ul>
    <p id="specs-desc" class="modal-desc"></p>
    <a href="project.html" class="hero-btn">Back to garage <i class="bi bi-arrow-left"></i></a>
  </div>
</section>

<footer>
  <div>Built by Khaled Mahmoud &middot; graduation project.</div>
  <br><br>
  <a href="tel:0403330368">To contact us call: 0403330368</a>
</footer>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<script src="car-data.js"></script>
<script src="render-car.js"></script>
</body>
</html>
