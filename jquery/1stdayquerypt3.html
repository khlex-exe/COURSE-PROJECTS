        *{

<body>
 <input type="text"><button>+</button>
<ol></ol>





    <script>
        let input = $("input")
        let ol = $("ol")
    $("button").click(()=>{
        ol.append("<li>"+input.val()+"</li>")
        input.val("")
    })
    
    </script>
