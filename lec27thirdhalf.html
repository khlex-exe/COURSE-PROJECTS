<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       div{
        position: relative;
       }
       #image1{
            width: 400px;
            height: 250px;
            position: absolute;
            z-index: 1;
       }
       #image2{
        width: 400px;
        height: 250px;
        position: absolute;
        z-index: -1;

       }
    </style>
</head>

<body>
    <div>
       <img id="image1" src="hold your horses.jpg" width="300px" height="200px" alt="">
       <img id="image2" src="Potential man strikes again.jpg" width="300px" height="200px" alt="">
    </div>
</body>
</html>
