<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       *{
        font-family: sans-serif;
        font-weight: bolder;
       }

       .outerp{
        text-align: center;
         border: 2px solid black;
         border-radius: 10px;
         padding: 9px;
         margin: 30px;
         background-color: rgb(33, 163, 33);
       }
       .main div{ border: 1px solid;}

       .main{
            height: 400px;
            font-size: 35px;
            font-weight: 600;
            display: grid;
            grid-template-columns:40% 60% ;
            gap: 5px 10px;
            
       }
      .main div h1{ 
        border-bottom: 100px;
        
        color: purple;
        
       }
       a{
        text-decoration: none;
        color: aqua;
       }


 
    </style>
</head>
<body>
    <p class="outerp">this is my lovely blog</p>
    <div class="main">
    <div class="h1">other things</div>
    <div class="h2">my article</div>
   </div>
   <p class="outerp" > <a href="#"> email me</a></p>
</body>
</html>
