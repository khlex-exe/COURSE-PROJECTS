<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- internal -->
    <style>
        *{ /*so its applied to the whole page*/
            font-family: cursive;
        }
        body{
            /* background-color: lightblue; */
            background-image: linear-gradient(to right ,pink ,
            lightpink,lightblue,cyan);
            /* background-image: radial-gradient(red,black); */ /*so this is just a circle*/
            background-image:url("hold your horses.jpg");
            background-repeat: no-repeat;
            background-attachment: fixed;       
            background-position: center ;       
            background-size:cover ;       
        
        }
      h3{
        color:blue;
        background-color: aqua;
        text-align: center;
        font-size: 40px;
        font-family: sans-serif;
        text-shadow: 0 0 15px purple;
        font-weight: lighter;
        border: 3px solid ;
      }
      a{
        color: red;
        text-decoration: none; 
        /* removes the line from under the link  */
        /* box model is to put a link inside a box*/
        /* padding the box from the inside, betweeen the link and the border  */
        /* margin is the box from outside,between the border and the walls  */
        border: 3px solid blue;
        padding: 3px 10px; /*makes the space inside the box*/
        border-radius: 1px 0 90px;/*makes a curve on the box*/ 
    }
    a:link{
        color: black;
    }
    a:visited{
        color: red;
    }
    a:hover{
        color: wheat;
        background-color: brown;
    }
    a:active{color: purple;}
    img{
        height: 250px;
        width: 300px;
        margin: 50px 100px;
    }
    #one{/*applied to anything with id one*/
        color: blue;
    }
    #two{ /*applied to anything with id two*/
        color: red;
    }
    .first{ /*applied to anything with class first*/
        color: green;
    }
    .two{/*applied to anything with class two*/
        font-size: 40px;
    }
    </style>
    
</head>
<body>
    inline 
    <div style="text-align:center"><h1 style="color:chocolate;">starting CSS</h1><h1 style="color:red">hello</h1></div>
     internal is h3 
     <h3>tanta university</h3>
     <a href="#">touch me</a>
     <br>    
     <img src="Potential man strikes again.jpg"  alt="pic">
     <!-- <img src="#gatchiakuta #anime.jpg" alt=""> -->
      <h5 id="one">hellozz</h5>
      <h5 id="two">hellozz</h5>
      <h5 class="first">hellozz</h5>
      <h5 class="first two">hellozz</h5>
      <h5 class="two">hellozz</h5>
      <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. In, rem!</p>
</body>
</html>
