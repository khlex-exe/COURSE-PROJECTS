<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1::after{
            content: '❤️';
        }
        h1::before{
            content: '💕';
        }
        ::selection{
            background-color: rgb(1, 1, 121);
            color: gray;
        }
    </style>
</head>
<body>
    <h1>university</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Sit, eius.</p>
    
</body>
</html>
